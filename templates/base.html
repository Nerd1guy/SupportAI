<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | SupportAI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar bg-dark text-white shadow">
            <div class="sidebar-header d-flex align-items-center gap-2 px-3 py-3 border-bottom border-secondary border-opacity-25">
                <div class="brand-icon">
                    <i class="fa-solid fa-headset text-white"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="brand-title fw-bold tracking-tight">Support<span class="text-azure">AI</span></span>
                    <span class="brand-sub text-muted" style="font-size: 0.72rem;">Intelligent Ticket Triage</span>
                </div>
            </div>

            <nav class="sidebar-nav py-3 px-2 flex-grow-1">
                <ul class="nav nav-pills flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-white-50 {% if request.path == '/' %}active text-white bg-primary{% endif %}" href="{{ url_for('index') }}">
                            <i class="fa-solid fa-chart-pie sidebar-icon"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50 {% if request.path == '/analyze' %}active text-white bg-primary{% endif %}" href="{{ url_for('analyze') }}">
                            <i class="fa-solid fa-wand-magic-sparkles sidebar-icon text-warning"></i>
                            <span>Analyze Ticket</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50 {% if request.path == '/history' %}active text-white bg-primary{% endif %}" href="{{ url_for('history') }}">
                            <i class="fa-solid fa-clock-rotate-left sidebar-icon text-info"></i>
                            <span>Ticket History</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50 {% if request.path == '/performance' %}active text-white bg-primary{% endif %}" href="{{ url_for('performance') }}">
                            <i class="fa-solid fa-microchip sidebar-icon text-success"></i>
                            <span>Model Performance</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer p-3 border-top border-secondary border-opacity-25 text-white-50 small">
                <div class="d-flex align-items-center gap-2">
                    <div class="status-indicator bg-success"></div>
                    <span style="font-size: 0.75rem;">ML Engine: Ready</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="app-main-content">
            <!-- Mobile Header Toggle (visible only on small screens) -->
            <header class="d-lg-none bg-dark text-white p-2 px-3 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <div class="brand-icon" style="width: 28px; height: 28px; font-size: 0.9rem;">
                        <i class="fa-solid fa-headset text-white"></i>
                    </div>
                    <span class="fw-bold">Support<span class="text-azure">AI</span></span>
                </div>
                <button class="btn btn-sm btn-outline-light" type="button" data-bs-toggle="collapse" data-bs-target="#mobileSidebar" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </header>

            <!-- Mobile Collapsible Menu -->
            <div class="collapse d-lg-none bg-dark text-white px-3 py-2 border-bottom" id="mobileSidebar">
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-white py-1" href="{{ url_for('index') }}"><i class="fa-solid fa-chart-pie me-2"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white py-1" href="{{ url_for('analyze') }}"><i class="fa-solid fa-wand-magic-sparkles me-2 text-warning"></i>Analyze Ticket</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white py-1" href="{{ url_for('history') }}"><i class="fa-solid fa-clock-rotate-left me-2 text-info"></i>Ticket History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white py-1" href="{{ url_for('performance') }}"><i class="fa-solid fa-microchip me-2 text-success"></i>Model Performance</a>
                    </li>
                </ul>
            </div>

            <!-- Page Content -->
            <main class="page-content-wrapper">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
